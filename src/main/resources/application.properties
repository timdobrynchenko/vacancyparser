spring.application.name=vacancyparser
server.port=8080

# База H2 в памяти: живет, пока работает приложение. Консоль - http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:mem:vacancies;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Источник: страницы вакансий hh.ru (публичный API hh закрыт для анонимных запросов с апреля 2026)
hh.base-url=https://hh.ru
# Сколько запросов к hh.ru идут одновременно (Semaphore) и пауза перед каждым - чтобы hh не заблокировал
hh.max-parallel-requests=3
hh.request-pause-ms=300
hh.timeout-seconds=15
# Если hh.ru недоступен - брать вакансии из встроенного примера src/main/resources/sample/vacancies.json
hh.fallback-to-sample=true

# Пул потоков для загрузки вакансий
collector.pool-size=6
collector.queue-capacity=100
collector.task-timeout-seconds=60

# Сбор по расписанию: первый запуск через 5 секунд после старта, потом раз в 30 минут
collector.schedule.enabled=true
collector.schedule.initial-delay-ms=5000
collector.schedule.delay-ms=1800000
collector.schedule.query=java
# Регион hh.ru: 1 - Москва, 2 - Санкт-Петербург, 113 - вся Россия
collector.schedule.area=2
collector.schedule.limit=15
